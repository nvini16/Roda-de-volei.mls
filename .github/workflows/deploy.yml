name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate supabase-config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          RODA_TIME_ZONE: ${{ vars.RODA_TIME_ZONE || 'America/Sao_Paulo' }}
        run: |
          set -euo pipefail
          node scripts/generate-supabase-config.mjs
          node --check supabase-config.js

      - name: Prepare static site folder
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html login.html perfil.html script.js supabase-auth.js supabase-config.js chat-widget.js _site/
          cp -r styles _site/
          if [ -d assets ]; then cp -r assets _site/; fi
          if [ -d images ]; then cp -r images _site/; fi
          if [ -d img ]; then cp -r img _site/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4