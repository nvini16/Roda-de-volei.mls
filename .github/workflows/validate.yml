name: Validate static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f login.html
          test -f perfil.html
          test -f styles/style.css
          test -f styles/login.css
          test -f styles/perfil.css
          test -f script.js
          test -f supabase-auth.js
          test -f README.md
          test -f .env.example
          test -f supabase-config.example.js
          test -f scripts/generate-supabase-config.mjs

      - name: Generate supabase-config.js when env vars are provided
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          RODA_TIME_ZONE: ${{ vars.RODA_TIME_ZONE }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            node scripts/generate-supabase-config.mjs
          else
            echo "SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY não definidos no workflow; pulando geração automática."
          fi

      - name: Check HTML and CSS references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          html_files = ['index.html', 'login.html', 'perfil.html']
          css_files = ['styles/style.css', 'styles/login.css', 'styles/perfil.css']
          html = '\n'.join(Path(f).read_text(encoding='utf-8') for f in html_files)
          css = '\n'.join(Path(f).read_text(encoding='utf-8') for f in css_files)
          refs = re.findall(r'(?:src|href)=["\']([^"\']+)["\']', html)
          refs += re.findall(r'url\(["\']?([^"\')]+)["\']?\)', css)
          external = ('http://', 'https://', '#', 'mailto:', 'tel:', 'data:')
          missing = []
          for ref in refs:
              if ref.startswith(external):
                  continue
              path = Path(ref.split('#', 1)[0].split('?', 1)[0])
              if path and not path.exists():
                  missing.append(ref)
          if missing:
              raise SystemExit('Missing local references: ' + ', '.join(missing))
          print('All local HTML and CSS references exist.')
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          node --check supabase-config.example.js
          node --check supabase-auth.js
          node --check scripts/generate-supabase-config.mjs
          if [ -f supabase-config.js ]; then
            node --check supabase-config.js
          fi

      - name: Check for merge-conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            echo 'Merge conflict marker detected.'
            exit 1
          fi