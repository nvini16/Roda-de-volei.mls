<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Seu perfil na Roda de Vôlei da E.E. Marlene Leite da Silva.">
  <meta name="theme-color" content="#0f0f0f">
  <title>Meu Perfil – Roda de Vôlei</title>
  <link rel="icon" type="image/webp" href="assets/images/logo.webp">
  <link rel="stylesheet" href="./styles/perfil.css">
  <link rel="stylesheet" href="styles/chat-widget.css" />
  <script type="module" src="supabase-auth.js"></script>
</head>
<body>
  <header class="site-header">
    <img class="logo-border" src="assets/images/logo.webp" alt="Logo da Roda de Vôlei da E.E. Marlene Leite da Silva" width="120" height="120">
    <h1>Meu Perfil</h1>
    <p>Roda de Vôlei • E.E. Marlene Leite da Silva</p>
  </header>

  <main>
    <section class="section account-section" id="perfilPageSection" aria-labelledby="perfil-title">
      <div class="section-heading">
        <h2 id="perfil-title">Dados do participante</h2>
        <a class="button btn-secondary" href="index.html">Voltar para a Home</a>
      </div>

      <!-- Exibido quando não há sessão ativa -->
      <div class="auth-box" id="authBox" hidden>
        <p id="authHint">Você precisa entrar na sua conta para visualizar e editar o perfil.</p>
        <div class="auth-actions">
          <a class="button" href="login.html">Ir para login</a>
        </div>
      </div>

      <!-- Exibido quando autenticado -->
      <div class="profile-panel" id="profilePanel" hidden>
        <div class="profile-header">
          <div>
            <p class="profile-greeting">Olá, <strong id="profileNameDisplay">Participante</strong></p>
            <p class="profile-meta" id="profileRoleDisplay"></p>
          </div>
          <button type="button" id="btnLogout" class="btn-secondary">Sair</button>
        </div>

        <form id="profileForm" class="profile-form">
          <label>
            Nome de exibição
            <input type="text" id="profileDisplayName" name="display_name" maxlength="60" required>
          </label>

          <label>
            Apelido na roda
            <input type="text" id="profileNickname" name="nickname" maxlength="30" placeholder="Opcional">
          </label>

          <button type="submit" id="btnSaveProfile">Salvar perfil</button>
        </form>

        <p class="auth-feedback" id="memberFeedback" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer>
    Tradição da roda de vôlei • Marlene Leite da Silva 2026
  </footer>

  <script type="module" src="chat-widget.js"></script>
</body>
</html>
