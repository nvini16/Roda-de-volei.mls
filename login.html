<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesse ou crie sua conta na Roda de Vôlei da E.E. Marlene Leite da Silva.">
  <meta name="theme-color" content="#0f0f0f">
  <title>Entrar – Roda de Vôlei</title>
  <link rel="icon" type="image/webp" href="assets/images/logo.webp">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="supabase-auth.js"></script>
</head>
<body>
  <header class="site-header">
    <img class="logo-border" src="assets/images/logo.webp" alt="Logo da Roda de Vôlei da E.E. Marlene Leite da Silva" width="120" height="120">
    <h1>Roda de Vôlei</h1>
    <p>E.E. Marlene Leite da Silva</p>
  </header>

  <main>
    <section class="section account-section" id="loginSection" aria-labelledby="login-title">
      <div class="section-heading">
        <h2 id="login-title">Entrar na comunidade</h2>
        <a class="button btn-secondary" href="index.html">Voltar para a Home</a>
      </div>

      <div class="auth-box" id="authBox">
        <p id="authHint">Entre com sua conta para acessar seu perfil e confirmar presença na roda de hoje.</p>

        <form id="authForm" class="auth-form" novalidate>
          <label>
            E-mail
            <input type="email" id="authEmail" name="email" autocomplete="email" required placeholder="seu@email.com">
          </label>

          <label> 
            Senha
            <input type="password" id="authPassword" name="password" autocomplete="current-password" required minlength="6" placeholder="••••••••">
          </label>

          <div class="auth-actions">
            <button type="submit" id="btnLogin">Entrar</button>
            <button type="button" id="btnSignup" class="btn-secondary">Criar conta</button>
          </div>
        </form>

        <p class="auth-feedback" id="authFeedback" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer>
    Tradição da roda de vôlei • Marlene Leite da Silva 2026
  </footer>
</body>
</html>
